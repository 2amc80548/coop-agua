services:
  # Servidor Web Green (Nginx en puerto 8082)
  web:
    image: nginx:alpine
    container_name: coop_agua_green_web
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # Aplicación Laravel Green (PHP 8.2 FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coop_agua_green_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_URL: "http://localhost:8082"
    volumes:
      - ./:/var/www
    depends_on:
      - db

  # Base de Datos compartida (misma que Blue)
  db:
    image: postgres:16-alpine
    container_name: coop_agua_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
