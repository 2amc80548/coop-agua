services:
  web:
    image: nginx:alpine
    container_name: coop_agua_green_web
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - coop_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coop_agua_green_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_URL: "http://localhost:8081"
      DB_HOST: coop_agua_db
    volumes:
      - ./:/var/www
    networks:
      - coop_network

networks:
  coop_network:
    name: coop_network
    external: true
