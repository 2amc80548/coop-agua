services:
  # Servidor Web (Nginx)
  web:
    image: nginx:alpine
    container_name: coop_agua_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # Aplicación Laravel (PHP 8.2 FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coop_agua_app
    restart: unless-stopped
    environment:
      APP_NAME: "CoopAgua"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8080"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: coop_agua_db
      DB_USERNAME: coop_user
      DB_PASSWORD: coop_password_secret
    volumes:
      - ./:/var/www
    depends_on:
      - db

  # Base de Datos (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: coop_agua_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: coop_agua_db
      POSTGRES_USER: coop_user
      POSTGRES_PASSWORD: coop_password_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
