services:
  # Servidor Web (Nginx) — usado solo para desarrollo local
  web:
    image: nginx:alpine
    container_name: coop_agua_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - coop_network

  # Aplicación Laravel (PHP 8.2 FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coop_agua_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: coop_agua_db
    volumes:
      - ./:/var/www
    depends_on:
      - db
    networks:
      - coop_network

  # Base de Datos (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: coop_agua_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coop_network

volumes:
  postgres_data:
    driver: local

networks:
  coop_network:
    name: coop_network
    driver: bridge
