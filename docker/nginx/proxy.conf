# Configuración del Proxy Nginx de entrada (Blue-Green Router)
# Este archivo va en /etc/nginx/conf.d/coop-agua.conf en el HOST de la EC2
# (NO dentro de Docker — este Nginx corre directo en el sistema operativo)

# El archivo /var/www/coop-agua/docker/active_port contiene "8081" o "8082"

upstream coop_agua_active {
    # Este bloque se reescribe dinámicamente por el script deploy.sh
    server 127.0.0.1:8081;
}

server {
    listen 8080;
    server_name _;

    location / {
        proxy_pass http://coop_agua_active;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
